allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "astro"
  - "@astrojs/**"
  - "eslint"
  - "@eslint/*"
  - "vite"
  - "@typescript-eslint/*"
  - http-cache-semantics@4.3.0

catalog:
  eslint: ^10.11.0

overrides:
  eslint: "catalog:"
  devalue: ">=5.9.3 <6.0.0"
  http-cache-semantics: ">=4.3.0 <5.0.0"

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
