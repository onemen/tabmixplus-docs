allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "astro"
  - "@astrojs/**"
  - "eslint"
  - "@eslint/*"
  - "vite"
  - "@typescript-eslint/*"
  - http-cache-semantics@4.3.0
  - fast-uri@3.1.9
  - glob@14.0.3
  - minimatch@11.0.2
  - zod@4.6.6
  - undici@8.12.2
  - '@isaacs/nonrecursive-glob-match@1.0.2'

catalog:
  eslint: ^10.11.0

overrides:
  eslint: "catalog:"
  "@emnapi/core": "1.11.3"
  "@emnapi/runtime": "1.11.3"
  devalue: ">=5.9.3 <6.0.0"
  http-cache-semantics: ">=4.3.0 <5.0.0"
  source-map-js: ">=1.2.2 <2.0.0"
  sharp: ">=0.35.5 <0.36.0"
  smol-toml: ">=1.9.0 <2.0.0"
  postcss-selector-parser: ">=7.1.6 <8.0.0"
  katex: ">=0.18.2 <0.19.0"
  vite: ">=8.3.3 <9.0.0"
  fast-uri@3: '>=3.1.9 <4.0.0'
  glob: '>=14.0.2'
  minimatch: '>=11.0.1'
  zod@4: '>=4.6.6'
  undici@8: '>=8.12.2 <9.0.0'

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
